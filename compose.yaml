name: pz-rcon-admin

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PZ_RCON_ADMIN_IMAGE:-ghcr.io/doomedgaming/pz-rcon-admin:latest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATA_PATH: /app/data/dashboard.json
      PZ_SECURE_CONFIG_DIR: /app/data/secure-config
    volumes:
      - zomboid-admin-data:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  zomboid-admin-data:
